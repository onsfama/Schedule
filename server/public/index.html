<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>알림픽</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="google-site-verification" content="YqzgV9xtXkqEv1CUtG-qRqdmmJkwc0GuMoFZEdP9op4" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2f6fed" />
  <link rel="icon" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="알림픽" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <header class="brand">
      <img src="/logo.png" alt="알림픽" class="brand-logo" />
    </header>
    <p class="subtitle">이미지를 올리면 AI가 일정을 읽어 구글 캘린더에 등록해줘요.</p>

    <section id="upload-section" class="card">
      <div class="drop-zone" id="drop-zone" role="button" tabindex="0">
        <span id="drop-zone-text">이미지를 선택하거나 여기로 드래그하세요 (여러 장 가능)</span>
        <div id="preview-list"></div>
      </div>
      <input id="image-input" type="file" accept="image/*" multiple hidden />
      <button id="analyze-btn" disabled>이미지 분석</button>
      <p id="upload-status" class="status"></p>
    </section>

    <section id="select-section" class="card" hidden>
      <p id="select-intro">등록할 일정을 선택해주세요.</p>
      <div id="event-list"></div>
      <button id="select-reset-btn" type="button" class="secondary">새 이미지 선택 / 취소</button>
    </section>

    <footer class="footer">
      <a href="/privacy.html">개인정보처리방침</a>
      <a href="/terms.html">이용약관</a>
    </footer>
  </div>

  <template id="event-form-template">
    <div class="event-body">
      <p class="confidence-banner banner" hidden>
        이미지에서 일정 정보를 명확히 읽지 못했어요. 아래 내용을 확인/수정해주세요.
      </p>

      <label>제목<input class="f-title" type="text" /></label>
      <label>날짜
        <span class="field-wrap">
          <input class="f-date" type="date" />
          <span class="field-mask"></span>
        </span>
      </label>

      <label class="checkbox">
        <input class="f-allday" type="checkbox" />
        하루 종일
      </label>

      <div class="f-time-fields row">
        <label>시작 시간
          <span class="field-wrap">
            <input class="f-start" type="time" />
            <span class="field-mask"></span>
          </span>
        </label>
        <label>종료 시간
          <span class="field-wrap">
            <input class="f-end" type="time" />
            <span class="field-mask"></span>
          </span>
        </label>
      </div>

      <label>장소<input class="f-location" type="text" /></label>
      <label>설명<textarea class="f-description" rows="3"></textarea></label>

      <button class="f-register" type="button" disabled>구글 캘린더에 등록</button>
      <p class="f-status status"></p>
    </div>
  </template>

  <script src="/config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="/app.js"></script>
</body>
</html>
